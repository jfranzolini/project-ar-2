<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>AR Tableau</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.css">
</head>

<body>

  <!-- Vidéo utilisée dans la scène -->
  <video 
    id="video1"
    src="videos/video1.mp4"
    preload="auto"
    loop
    muted
    playsinline
    crossorigin="anonymous">
  </video>

  <!-- Scène AR -->
  <a-scene
    mindar-image="imageTargetSrc: markers/tableau1.mind;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Assets -->
    <a-assets>
      <video 
        id="videoAsset"
        src="videos/video1.mp4"
        preload="auto"
        loop
        muted
        playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <!-- Caméra -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Objet qui apparaît quand le marker est reconnu -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        src="#videoAsset"
        width="1"
        height="0.75"
        position="0 0 0"
        rotation="0 0 0">
      </a-video>
    </a-entity>

  </a-scene>

</body>
</html>
